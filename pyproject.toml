[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-sector-investor-map"
version = "0.1.0"
description = "India focus-sector equity map: Damodaran sector layer x 20-market universe, per-name profitability via yfinance"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "pyarrow>=10", "yfinance>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["focus_sector_map"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["graphify-out", "notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E402",  # scripts extend sys.path before importing the package
    "UP035", "UP045",  # keep typing.Optional / typing.Callable: repo supports Python 3.9
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
